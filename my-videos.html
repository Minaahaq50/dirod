<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <title>🎬 لوحة تعديل روابط الفيديوهات</title>

  <!-- Firebase -->
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>

  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&display=swap" rel="stylesheet">

  <style>
    body {
      font-family: 'Cairo', sans-serif;
      background: #f4f6f9;
      color: #333;
      text-align: center;
      margin: 0;
      padding: 0;
    }

    h2 {
      color: #007bff;
      margin-top: 20px;
    }

    .container {
      width: 90%;
      max-width: 700px;
      margin: 20px auto;
      background: #fff;
      padding: 20px;
      border-radius: 12px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
    }

    input, select, button {
      padding: 10px;
      margin: 6px;
      border-radius: 8px;
      border: 1px solid #ccc;
      width: 90%;
      font-size: 16px;
    }

    button {
      background: #007bff;
      color: #fff;
      border: none;
      cursor: pointer;
      transition: 0.3s;
    }

    button:hover {
      background: #0056b3;
    }

    .video-card {
      border: 1px solid #ddd;
      border-radius: 10px;
      padding: 10px;
      margin-bottom: 10px;
      background: #fafafa;
      text-align: right;
    }

    .video-card p {
      margin: 4px 0;
    }

    .success {
      color: green;
      font-weight: bold;
    }

    .error {
      color: red;
      font-weight: bold;
    }

    .flex {
      display: flex;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 10px;
    }

    select {
      width: 48%;
    }

  </style>
</head>
<body>

  <h2>🔐 تسجيل الدخول</h2>

  <!-- صندوق تسجيل الدخول -->
  <div class="container" id="loginBox">
    <input id="email" type="email" placeholder="البريد الإلكتروني"><br>
    <input id="password" type="password" placeholder="كلمة المرور"><br>
    <button onclick="login()">تسجيل الدخول</button>
  </div>

  <!-- لوحة الأدمن -->
  <div class="container" id="adminPanel" style="display:none;">
    <h2>🎬 تعديل روابط الفيديوهات</h2>

    <div class="flex">
      <select id="subjectSelect" onchange="loadVideos()">
        <option value="">-- اختر المادة --</option>
      </select>
      <select id="teacherSelect" onchange="loadVideos()">
        <option value="">-- اختر المدرس --</option>
      </select>
    </div>

    <div id="videosList" style="margin-top:20px;text-align:right;max-height:400px;overflow-y:auto;">
      <p>اختر المادة أو المدرس لعرض الفيديوهات...</p>
    </div>
  </div>

  <script>
    // إعداد Firebase
    const firebaseConfig = {
      apiKey: "AIzaSyCdhj73cKJc2J2_tDHw2-89EemZx-EGMJQ",
      authDomain: "alamer-526ff.firebaseapp.com",
      databaseURL: "https://alamer-526ff-default-rtdb.firebaseio.com",
      projectId: "alamer-526ff",
      storageBucket: "alamer-526ff.firebasestorage.app",
      messagingSenderId: "523879269039",
      appId: "1:523879269039:web:634861aa34641bfebf8a5a",
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();
    const auth = firebase.auth();

    const ADMIN_UID = "Se5eNLTKoqUGjeShmRJRHDiKogF3";

    // تسجيل الدخول
    function login() {
      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value.trim();

      auth.signInWithEmailAndPassword(email, password)
        .then(userCredential => {
          const user = userCredential.user;
          if (user.uid === ADMIN_UID) {
            document.getElementById("loginBox").style.display = "none";
            document.getElementById("adminPanel").style.display = "block";
            loadFilters();
          } else {
            alert("❌ هذا الحساب ليس أدمن");
            auth.signOut();
          }
        })
        .catch(err => alert("⚠️ خطأ: " + err.message));
    }

    // تحميل المواد والمدرسين
    async function loadFilters() {
      const snapshot = await db.ref("videos").get();
      if (!snapshot.exists()) return alert("❌ لا توجد فيديوهات في الداتا");

      const data = snapshot.val();
      const subjects = new Set();
      const teachers = new Set();

      Object.values(data).forEach(v => {
        if (v.subject) subjects.add(v.subject);
        if (v.teacher) teachers.add(v.teacher);
      });

      const subjectSelect = document.getElementById("subjectSelect");
      const teacherSelect = document.getElementById("teacherSelect");

      subjectSelect.innerHTML = '<option value="">-- اختر المادة --</option>';
      teacherSelect.innerHTML = '<option value="">-- اختر المدرس --</option>';

      subjects.forEach(s => subjectSelect.innerHTML += `<option value="${s}">${s}</option>`);
      teachers.forEach(t => teacherSelect.innerHTML += `<option value="${t}">${t}</option>`);
    }

    // تحميل الفيديوهات
    async function loadVideos() {
      const subject = document.getElementById("subjectSelect").value;
      const teacher = document.getElementById("teacherSelect").value;
      const container = document.getElementById("videosList");
      container.innerHTML = "<p>⏳ جاري التحميل...</p>";

      const snapshot = await db.ref("videos").get();
      if (!snapshot.exists()) return container.innerHTML = "<p class='error'>❌ لا توجد فيديوهات</p>";

      const data = snapshot.val();
      const filtered = Object.entries(data).filter(([id, v]) =>
        (!subject || v.subject === subject) &&
        (!teacher || v.teacher === teacher)
      );

      if (filtered.length === 0) {
        container.innerHTML = "<p class='success'>🎉 لا توجد فيديوهات مطابقة</p>";
        return;
      }

      container.innerHTML = "";

      filtered.forEach(([id, v]) => {
        const div = document.createElement("div");
        div.className = "video-card";
        div.innerHTML = `
          <p><b>${v.title || "بدون عنوان"}</b></p>
          <p style="color:#555;">${v.subject} - ${v.teacher}</p>
          <input id="link-${id}" type="text" value="${v.url || ""}" placeholder="رابط الفيديو">
          <button onclick="updateLink('${id}')">💾 حفظ التعديل</button>
        `;
        container.appendChild(div);
      });
    }

    // تعديل الرابط
    async function updateLink(videoId) {
      const input = document.getElementById(`link-${videoId}`);
      const newLink = input.value.trim();
      if (!newLink) return alert("⚠️ من فضلك أدخل رابط صحيح");

      try {
        await db.ref(`videos/${videoId}/url`).set(newLink);
        input.style.borderColor = "green";
        alert("✅ تم تحديث الرابط بنجاح");
      } catch (e) {
        alert("❌ خطأ أثناء التحديث: " + e.message);
      }
    }

    window.login = login;
    window.loadVideos = loadVideos;
    window.updateLink = updateLink;
  </script>

</body>
</html>

<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>📊 أرباح الاشتراكات الأسبوعية</title>

<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>

<style>
body {
  font-family: 'Cairo', sans-serif;
  background: #0e0e0e;
  color: white;
  padding: 30px;
  text-align: center;
}

h1 {
  color: #00f5c4;
  margin-bottom: 20px;
}

table {
  width: 100%;
  max-width: 800px;
  margin: 0 auto;
  border-collapse: collapse;
  background: #1a1a1a;
  border-radius: 10px;
  overflow: hidden;
  box-shadow: 0 0 10px #00f5c433;
}

th, td {
  padding: 15px;
  border-bottom: 1px solid #333;
}

th {
  background: #00f5c410;
  color: #00f5c4;
  font-size: 16px;
}

td {
  font-size: 15px;
}

tr:hover {
  background: #222;
}

#status {
  color: #00f5c4;
  margin: 15px;
}
</style>
</head>
<body>

<h1>📊 أرباح الاشتراكات الأسبوعية</h1>
<p id="status">جارٍ تحميل البيانات...</p>

<table id="earningsTable">
  <thead>
    <tr>
      <th>🗓 الأسبوع</th>
      <th>👥 عدد المشتركين</th>
      <th>💰 الأرباح (جنيه)</th>
    </tr>
  </thead>
  <tbody id="tableBody"></tbody>
</table>

<script>
// إعداد Firebase
const firebaseConfig = {
  apiKey: "AIzaSyCdhj73cKJc2J2_tDHw2-89EemZx-EGMJQ",
  authDomain: "alamer-526ff.firebaseapp.com",
  databaseURL: "https://alamer-526ff-default-rtdb.firebaseio.com",
  projectId: "alamer-526ff",
  storageBucket: "alamer-526ff.appspot.com",
  messagingSenderId: "523879269039",
  appId: "1:523879269039:web:634861aa34641bfebf8a5a"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.database();

const tableBody = document.getElementById("tableBody");
const statusEl = document.getElementById("status");

const subscriptionPrice = 100; // سعر الاشتراك
const msPerWeek = 7 * 24 * 60 * 60 * 1000;

// 🔹 تحميل المشتركين وحساب الأرباح
function calculateWeeklyEarnings() {
  db.ref("approvedStudents").once("value").then(snapshot => {
    if (!snapshot.exists()) {
      statusEl.textContent = "❌ لا يوجد طلاب.";
      return;
    }

    const now = Date.now();
    const firstWeek = new Date(2024, 0, 1).getTime(); // بداية السنة
    const currentWeek = Math.floor((now - firstWeek) / msPerWeek);

    let weeklyData = {};

    snapshot.forEach(child => {
      const data = child.val();
      const approvedAt = data.approvedAt || 0;
      const expiry = data.expiry || 0;
      const duration = expiry - approvedAt;
      const twoDays = 2 * 24 * 60 * 60 * 1000;

      if (duration <= twoDays) return; // تجاهل التجربة

      const weekNum = Math.floor((approvedAt - firstWeek) / msPerWeek);
      if (!weeklyData[weekNum]) {
        weeklyData[weekNum] = { count: 0, total: 0 };
      }
      weeklyData[weekNum].count++;
      weeklyData[weekNum].total += subscriptionPrice;
    });

    // حفظ الأرباح في قاعدة البيانات
    db.ref("weeklyEarnings").set(weeklyData);

    // عرضها في الجدول
    renderTable(weeklyData, currentWeek);
    statusEl.textContent = "✅ تم تحميل أرباح الأسابيع بنجاح.";
  });
}

function renderTable(weeklyData, currentWeek) {
  tableBody.innerHTML = "";
  const sortedWeeks = Object.keys(weeklyData).sort((a,b)=>b-a);

  sortedWeeks.forEach(weekNum => {
    const w = weeklyData[weekNum];
    const weekLabel = (weekNum == currentWeek) ? "الأسبوع الحالي" : `الأسبوع ${weekNum}`;
    const row = `
      <tr style="${weekNum == currentWeek ? 'background:#00f5c420;' : ''}">
        <td>${weekLabel}</td>
        <td>${w.count}</td>
        <td>${w.total}</td>
      </tr>
    `;
    tableBody.insertAdjacentHTML("beforeend", row);
  });
}

calculateWeeklyEarnings();
</script>
</body>
</html>

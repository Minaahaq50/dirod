<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <title>🎬 تعديل روابط الفيديوهات حسب المادة والمدرس</title>

  <!-- Firebase -->
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>

  <script>
    // إعداد Firebase
    const firebaseConfig = {
      apiKey: "AIzaSyCdhj73cKJc2J2_tDHw2-89EemZx-EGMJQ",
      authDomain: "alamer-526ff.firebaseapp.com",
      databaseURL: "https://alamer-526ff-default-rtdb.firebaseio.com",
      projectId: "alamer-526ff",
      storageBucket: "alamer-526ff.firebasestorage.app",
      messagingSenderId: "523879269039",
      appId: "1:523879269039:web:634861aa34641bfebf8a5a",
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();
    const auth = firebase.auth();

    const ADMIN_UID = "Se5eNLTKoqUGjeShmRJRHDiKogF3";

    // تسجيل الدخول
    function login() {
      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value.trim();

      auth.signInWithEmailAndPassword(email, password)
        .then(userCredential => {
          const user = userCredential.user;
          if (user.uid === ADMIN_UID) {
            document.getElementById("loginBox").style.display = "none";
            document.getElementById("adminPanel").style.display = "block";
            loadFilters();
          } else {
            alert("❌ هذا الحساب ليس أدمن");
            auth.signOut();
          }
        })
        .catch(err => alert("خطأ: " + err.message));
    }

    // تحميل المواد والمدرسين
    async function loadFilters() {
      const snapshot = await db.ref("videos").get();
      if (!snapshot.exists()) return alert("❌ لا توجد فيديوهات في الداتا");

      const data = snapshot.val();
      const subjects = new Set();
      const teachers = new Set();

      Object.values(data).forEach(v => {
        if (v.subject) subjects.add(v.subject);
        if (v.teacher) teachers.add(v.teacher);
      });

      const subjectSelect = document.getElementById("subjectSelect");
      const teacherSelect = document.getElementById("teacherSelect");

      subjectSelect.innerHTML = <option value="">-- اختر المادة --</option>;
      teacherSelect.innerHTML = <option value="">-- اختر المدرس --</option>;

      subjects.forEach(s => subjectSelect.innerHTML += <option value="${s}">${s}</option>);
      teachers.forEach(t => teacherSelect.innerHTML += <option value="${t}">${t}</option>);
    }

    // تحميل الفيديوهات حسب المادة والمدرس
    async function loadVideos() {
      const subject = document.getElementById("subjectSelect").value;
      const teacher = document.getElementById("teacherSelect").value;
      const container = document.getElementById("videosList");
      container.innerHTML = "<p>⏳ جاري التحميل...</p>";

      const snapshot = await db.ref("videos").get();
      if (!snapshot.exists()) return container.innerHTML = "<p style='color:red;'>❌ لا توجد فيديوهات</p>";

      const data = snapshot.val();
      const filtered = Object.entries(data).filter(([id, v]) =>
        (!subject || v.subject === subject) &&
        (!teacher || v.teacher === teacher)
      );

      if (filtered.length === 0) {
        container.innerHTML = "<p style='color:green;'>🎉 لا توجد فيديوهات مطابقة</p>";
        return;
      }

      container.innerHTML = "";

      filtered.forEach(([id, v]) => {
        const div = document.createElement("div");
        div.style.marginBottom = "10px";
        div.style.padding = "10px";
        div.style.border = "1px solid #ddd";
        div.style.borderRadius = "8px";
        div.style.background = "#fff";

        div.innerHTML = `
          <p><b>${v.title || "بدون عنوان"}</b></p>
          <p style="color:#555;">${v.subject} - ${v.teacher}</p>
          <input id="link-${id}" type="text" value="${v.url || ""}" placeholder="رابط الفيديو" style="width:90%;padding:6px;border-radius:6px;border:1px solid #ccc;">
          <button onclick="updateLink('${id}')" style="margin-top:6px;padding:6px 10px;border:none;border-radius:6px;background:#28a745;color:#fff;">💾 حفظ</button>
        `;
        container.appendChild(div);
      });
    }

    // تعديل الرابط في Firebase
    async function updateLink(videoId) {
      const input = document.getElementById(link-${videoId});
      const newLink = input.value.trim();

      if (!newLink) return alert("❌ من فضلك أدخل رابط صحيح");

      try {
        await db.ref(videos/${videoId}/url).set(newLink);
        input.style.borderColor = "green";
        alert("✅ تم تحديث الرابط بنجاح");
      } catch (e) {
        alert("❌ خطأ أثناء التحديث: " + e.message);
      }
    }

    window.login = login;
    window.loadVideos = loadVideos;
    window.updateLink = updateLink;
  </script>
</head>

<body style="font-family:'Cairo',sans-serif;text-align:center;background:#f0f2f5;padding:20px;">

  <h2>🔐 تسجيل الدخول</h2>

  <div id="loginBox">
    <input id="email" type="email" placeholder="البريد الإلكتروني" style="padding:8px;margin:5px;"><br>
    <input id="password" type="password" placeholder="كلمة المرور" style="padding:8px;margin:5px;"><br>
    <button onclick="login()" style="padding:10px 20px;border:none;border-radius:8px;background:#007bff;color:#fff;">تسجيل الدخول</button>
  </div>

  <div id="adminPanel" style="display:none;">
    <h2>🎬 تعديل روابط الفيديوهات</h2>

    <div style="margin:10px;">
      <select id="subjectSelect" onchange="loadVideos()" style="padding:8px;border-radius:6px;">
        <option value="">-- اختر المادة --</option>
      </select>

      <select id="teacherSelect" onchange="loadVideos()" style="padding:8px;border-radius:6px;">
        <option value="">-- اختر المدرس --</option>
      </select>
    </div>

    <div id="videosList" style="margin:20px;text-align:right;background:#fff;padding:15px;border-radius:10px;max-height:400px;overflow-y:auto;">
      <p>اختر المادة أو المدرس لعرض الفيديوهات...</p>
    </div>
  </div>
</body>
</html>

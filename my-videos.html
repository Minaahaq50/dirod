<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>📊 أرباح الأسبوع الحالي</title>

<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>

<!-- Chart.js -->
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
body {
  font-family: 'Cairo', sans-serif;
  background: #0e1117;
  color: white;
  text-align: center;
  padding: 20px;
}
h1 {
  color: #00f5c4;
  margin-bottom: 10px;
}
#weekRange {
  font-size: 18px;
  color: #ccc;
  margin-bottom: 20px;
}
table {
  width: 100%;
  max-width: 900px;
  margin: 0 auto;
  border-collapse: collapse;
  background: #1b1f27;
  border-radius: 12px;
  overflow: hidden;
  box-shadow: 0 0 10px #00f5c460;
}
th, td {
  padding: 10px;
  border-bottom: 1px solid #333;
}
th {
  background: #00f5c4;
  color: #111;
}
tr:hover {
  background: #222833;
}
tr.week-ending {
  background-color: rgba(255, 0, 0, 0.2) !important;
}
#summary {
  margin: 20px;
  font-size: 18px;
  color: #00f5c4;
}
canvas {
  max-width: 700px;
  margin: 20px auto;
  background: #1b1f27;
  border-radius: 10px;
  padding: 10px;
}
</style>
</head>
<body>

<h1>💰 أرباح الاشتراكات للأسبوع الحالي</h1>
<p id="weekRange"></p>

<table>
  <thead>
    <tr>
      <th>الاسم</th>
      <th>تاريخ البداية</th>
      <th>تاريخ النهاية</th>
      <th>مدة الاشتراك (يوم)</th>
      <th>الأرباح (جنيه)</th>
    </tr>
  </thead>
  <tbody id="studentsTable"></tbody>
</table>

<p id="summary"></p>
<canvas id="earningsChart"></canvas>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyCdhj73cKJc2J2_tDHw2-89EemZx-EGMJQ",
  authDomain: "alamer-526ff.firebaseapp.com",
  databaseURL: "https://alamer-526ff-default-rtdb.firebaseio.com",
  projectId: "alamer-526ff",
  storageBucket: "alamer-526ff.appspot.com",
  messagingSenderId: "523879269039",
  appId: "1:523879269039:web:634861aa34641bfebf8a5a"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.database();

// 🔹 تحديد الأسبوع الحالي (الإثنين إلى الأحد)
function getCurrentWeekRange() {
  const today = new Date();
  const day = today.getDay();
  const monday = new Date(today);
  monday.setDate(today.getDate() - ((day + 6) % 7));
  monday.setHours(0, 0, 0, 0);
  const sunday = new Date(monday);
  sunday.setDate(monday.getDate() + 6);
  sunday.setHours(23, 59, 59, 999);
  return { start: monday, end: sunday };
}

function loadEarnings() {
  const { start, end } = getCurrentWeekRange();
  const today = new Date();
  document.getElementById("weekRange").textContent =
    `🗓 من ${start.toLocaleDateString("ar-EG")} إلى ${end.toLocaleDateString("ar-EG")}`;

  // 🔸 تحديد لو الأسبوع قرب يخلص (آخر يومين)
  const daysLeftInWeek = Math.ceil((end - today) / (1000 * 60 * 60 * 24));
  const weekEndingSoon = daysLeftInWeek <= 2;

  db.ref("approvedStudents").once("value").then(snapshot => {
    const studentsTable = document.getElementById("studentsTable");
    studentsTable.innerHTML = "";
    let totalEarnings = 0;
    const monthlyPrice = 100;

    snapshot.forEach(child => {
      const s = child.val();
      const name = s.name || "-";
      const approvedAt = s.approvedAt || 0;
      const expiry = s.expiry || 0;

      const startDate = new Date(approvedAt);
      const endDate = new Date(expiry);
      const durationDays = Math.ceil((expiry - approvedAt) / (1000 * 60 * 60 * 24));

      // ✅ يظهر فقط اللي بدأ اشتراكه هذا الأسبوع
      if (startDate >= start && startDate <= end) {
        if (durationDays >= 27) { // من 20 يوم أو أكثر نعتبره اشتراك شهري
          const monthsCount = Math.floor(durationDays / 30) || 1;
          const earnings = monthsCount * monthlyPrice;
          totalEarnings += earnings;

          const tr = document.createElement("tr");
          if (weekEndingSoon) tr.classList.add("week-ending");

          tr.innerHTML = `
            <td>${name}</td>
            <td>${startDate.toLocaleDateString("ar-EG")}</td>
            <td>${endDate.toLocaleDateString("ar-EG")}</td>
            <td>${durationDays}</td>
            <td>${earnings}</td>
          `;
          studentsTable.appendChild(tr);
        }
      }
    });

    if (totalEarnings === 0) {
      studentsTable.innerHTML = `<tr><td colspan="5">😴 لا يوجد اشتراكات جديدة هذا الأسبوع.</td></tr>`;
    }

    document.getElementById("summary").textContent =
      `💵 إجمالي أرباح هذا الأسبوع: ${totalEarnings} جنيه`;

    renderChart(totalEarnings);
  });
}

function renderChart(total) {
  const ctx = document.getElementById("earningsChart");
  new Chart(ctx, {
    type: 'bar',
    data: {
      labels: ['أرباح الأسبوع الحالي'],
      datasets: [{
        label: 'الأرباح بالجنيه',
        data: [total],
        backgroundColor: '#00f5c4'
      }]
    },
    options: { scales: { y: { beginAtZero: true } } }
  });
}

loadEarnings();
</script>

</body>
</html>

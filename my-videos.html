<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>📊 أرباح الأسبوع الحالي</title>

<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>

<!-- Chart.js -->
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
body {
  font-family: 'Cairo', sans-serif;
  background: #0e1117;
  color: white;
  text-align: center;
  padding: 20px;
}
h1 {
  color: #00f5c4;
  margin-bottom: 10px;
}
#weekRange {
  font-size: 18px;
  color: #ccc;
  margin-bottom: 20px;
}
table {
  width: 100%;
  max-width: 900px;
  margin: 0 auto;
  border-collapse: collapse;
  background: #1b1f27;
  border-radius: 12px;
  overflow: hidden;
  box-shadow: 0 0 10px #00f5c460;
}
th, td {
  padding: 10px;
  border-bottom: 1px solid #333;
}
th {
  background: #00f5c4;
  color: #111;
}
tr:hover {
  background: #222833;
}
#summary {
  margin: 20px;
  font-size: 18px;
  color: #00f5c4;
}
canvas {
  max-width: 700px;
  margin: 20px auto;
  background: #1b1f27;
  border-radius: 10px;
  padding: 10px;
}
</style>
</head>
<body>

<h1>💰 أرباح الاشتراكات للأسبوع الحالي</h1>
<p id="weekRange"></p>

<table>
  <thead>
    <tr>
      <th>الاسم</th>
      <th>تاريخ البداية</th>
      <th>تاريخ النهاية</th>
      <th>مدة الاشتراك (يوم)</th>
      <th>الأرباح (جنيه)</th>
    </tr>
  </thead>
  <tbody id="studentsTable"></tbody>
</table>

<p id="summary"></p>
<canvas id="earningsChart"></canvas>

<script>
// ✅ إعداد Firebase
const firebaseConfig = {
  apiKey: "AIzaSyCdhj73cKJc2J2_tDHw2-89EemZx-EGMJQ",
  authDomain: "alamer-526ff.firebaseapp.com",
  databaseURL: "https://alamer-526ff-default-rtdb.firebaseio.com",
  projectId: "alamer-526ff",
  storageBucket: "alamer-526ff.appspot.com",
  messagingSenderId: "523879269039",
  appId: "1:523879269039:web:634861aa34641bfebf8a5a"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.database();

// 🗓️ تحديد الأسبوع الحالي (الإثنين إلى الأحد)
function getCurrentWeekRange() {
  const today = new Date();
  const day = today.getDay();
  const monday = new Date(today);
  monday.setDate(today.getDate() - ((day + 6) % 7)); // الإثنين
  monday.setHours(0, 0, 0, 0);
  const sunday = new Date(monday);
  sunday.setDate(monday.getDate() + 6); // الأحد
  sunday.setHours(23, 59, 59, 999);
  return { start: monday, end: sunday };
}

// 🔍 تحميل الأرباح
function loadEarnings() {
  const { start, end } = getCurrentWeekRange();
  document.getElementById("weekRange").textContent =
    `🗓 من ${start.toLocaleDateString("ar-EG")} إلى ${end.toLocaleDateString("ar-EG")}`;

  db.ref("approvedStudents").once("value").then(snapshot => {
    const tableBody = document.getElementById("studentsTable");
    tableBody.innerHTML = "";
    let totalEarnings = 0;
    const monthlyPrice = 100;

    snapshot.forEach(child => {
      const data = child.val();
      const name = data.name || "-";
      const approvedAt = data.approvedAt || 0;
      const expiry = data.expiry || 0;

      const startDate = new Date(approvedAt);
      const endDate = new Date(expiry);
      const durationDays = Math.ceil((expiry - approvedAt) / (1000 * 60 * 60 * 24));

      // ✅ فقط من بدأ هذا الأسبوع
      if (startDate >= start && startDate <= end) {
        let earnings = 0;

        // 🔸 لو تجربة (أقل من يومين)
        if (durationDays < 2) {
          earnings = 0;
        }
        // 🔸 اشتراك شهري من 20 يوم أو أكثر
        else if (durationDays >= 20) {
          let monthsCount = Math.floor(durationDays / 30);
          if (monthsCount === 0) monthsCount = 1; // من 20 لـ29 يوم نحسبه شهر
          earnings = monthsCount * monthlyPrice;
        }

        // 💰 أضف إلى الإجمالي لو في أرباح
        if (earnings > 0) totalEarnings += earnings;

        // 🧾 أضف الصف للجدول
        const tr = document.createElement("tr");
        tr.innerHTML = `
          <td>${name}</td>
          <td>${startDate.toLocaleDateString("ar-EG")}</td>
          <td>${endDate.toLocaleDateString("ar-EG")}</td>
          <td>${durationDays}</td>
          <td>${earnings}</td>
        `;
        tableBody.appendChild(tr);
      }
    });

    // لا يوجد اشتراكات
    if (tableBody.innerHTML === "") {
      tableBody.innerHTML = `<tr><td colspan="5">😴 لا يوجد اشتراكات جديدة هذا الأسبوع.</td></tr>`;
    }

    document.getElementById("summary").textContent =
      `💵 إجمالي أرباح هذا الأسبوع: ${totalEarnings} جنيه`;

    renderChart(totalEarnings);
  });
}

// 📊 رسم بياني للأرباح
function renderChart(total) {
  const ctx = document.getElementById("earningsChart");
  new Chart(ctx, {
    type: 'bar',
    data: {
      labels: ['أرباح الأسبوع الحالي'],
      datasets: [{
        label: 'بالجنيه المصري',
        data: [total],
        backgroundColor: '#00f5c4'
      }]
    },
    options: {
      scales: {
        y: { beginAtZero: true }
      },
      plugins: {
        legend: { labels: { color: 'white' } }
      }
    }
  });
}

loadEarnings();
</script>

</body>
</html>

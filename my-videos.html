<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>📅 أرباح الاشتراكات الأسبوعية</title>

<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
body {
  font-family: 'Cairo', sans-serif;
  background: #111;
  color: #fff;
  text-align: center;
  padding: 20px;
}
h1 { color: #00f5c4; }
table {
  margin: 20px auto;
  border-collapse: collapse;
  width: 95%;
  background: #1a1a1a;
  border-radius: 10px;
  overflow: hidden;
}
th, td {
  padding: 10px;
  border-bottom: 1px solid #333;
}
th {
  background: #00f5c420;
  color: #00f5c4;
}
tr:hover {
  background: #222;
}
canvas {
  max-width: 900px;
  margin: 30px auto;
  display: block;
}
</style>
</head>
<body>

<h1>📊 لوحة أرباح الاشتراكات الأسبوعية</h1>
<p id="status">⏳ جاري الحساب...</p>

<canvas id="chart" height="120"></canvas>

<table>
  <thead>
    <tr>
      <th>🗓 الأسبوع</th>
      <th>📅 من تاريخ</th>
      <th>📅 إلى تاريخ</th>
      <th>👥 عدد المشتركين</th>
      <th>💰 الأرباح (جنيه)</th>
    </tr>
  </thead>
  <tbody id="tableBody"></tbody>
</table>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyCdhj73cKJc2J2_tDHw2-89EemZx-EGMJQ",
  authDomain: "alamer-526ff.firebaseapp.com",
  databaseURL: "https://alamer-526ff-default-rtdb.firebaseio.com",
  projectId: "alamer-526ff",
  storageBucket: "alamer-526ff.appspot.com",
  messagingSenderId: "523879269039",
  appId: "1:523879269039:web:634861aa34641bfebf8a5a"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.database();

const DAY = 24 * 60 * 60 * 1000;
const WEEK = 7 * DAY;
const MONTH = 30 * DAY;
const PRICE = 100;

const statusEl = document.getElementById("status");
const tableBody = document.getElementById("tableBody");

function getWeekRange(date) {
  const start = new Date(date);
  const day = start.getDay(); // 0 = الأحد
  const diff = day === 1 ? 0 : (day + 6) % 7; // نعتبر الاثنين بداية الأسبوع
  const weekStart = new Date(start - diff * DAY);
  const weekEnd = new Date(weekStart.getTime() + 6 * DAY);
  return { start: weekStart, end: weekEnd };
}

function formatDate(d) {
  return d.toLocaleDateString("ar-EG");
}

function calculateWeeklyEarnings() {
  db.ref("approvedStudents").once("value").then(snapshot => {
    if (!snapshot.exists()) {
      statusEl.textContent = "❌ لا يوجد طلاب.";
      return;
    }

    const weeklyData = {};

    snapshot.forEach(child => {
      const data = child.val();
      const approvedAt = data.approvedAt || 0;
      const expiry = data.expiry || 0;
      const duration = expiry - approvedAt;

      if (!approvedAt || !expiry || duration < 2 * DAY) return;

      // لو الاشتراك أكتر من شهر، احسب كل 30 يوم = 100 جنيه
      const monthsCount = Math.ceil(duration / MONTH);

      for (let i = 0; i < monthsCount; i++) {
        const paymentDate = approvedAt + i * MONTH;
        const { start, end } = getWeekRange(paymentDate);
        const weekKey = start.toISOString().slice(0,10);

        if (!weeklyData[weekKey]) {
          weeklyData[weekKey] = { start, end, count: 0, total: 0 };
        }

        weeklyData[weekKey].count++;
        weeklyData[weekKey].total += PRICE;
      }
    });

    renderTable(weeklyData);
    renderChart(weeklyData);
    statusEl.textContent = "✅ تم حساب الأرباح بنجاح.";
  });
}

function renderTable(data) {
  tableBody.innerHTML = "";
  const sortedWeeks = Object.values(data).sort((a,b)=>a.start-b.start);

  sortedWeeks.forEach((w, i) => {
    const tr = `
      <tr>
        <td>الأسبوع ${i+1}</td>
        <td>${formatDate(w.start)}</td>
        <td>${formatDate(w.end)}</td>
        <td>${w.count}</td>
        <td>${w.total}</td>
      </tr>
    `;
    tableBody.insertAdjacentHTML("beforeend", tr);
  });
}

function renderChart(data) {
  const sortedWeeks = Object.values(data).sort((a,b)=>a.start-b.start);
  const labels = sortedWeeks.map(w => `${formatDate(w.start)} - ${formatDate(w.end)}`);
  const totals = sortedWeeks.map(w => w.total);

  new Chart(document.getElementById("chart"), {
    type: "line",
    data: {
      labels,
      datasets: [{
        label: "💰 الأرباح بالجنيه",
        data: totals,
        borderColor: "#00f5c4",
        backgroundColor: "#00f5c455",
        fill: true,
        tension: 0.3
      }]
    },
    options: {
      scales: {
        x: { ticks: { color: "#fff" } },
        y: { ticks: { color: "#fff" }, beginAtZero: true }
      }
    }
  });
}

calculateWeeklyEarnings();
</script>
</body>
</html>

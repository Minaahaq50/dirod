<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>📊 أرباح الاشتراكات الأسبوعية</title>

<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
<!-- Chart.js -->
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
body {
  font-family: 'Cairo', sans-serif;
  background: #0e0e0e;
  color: white;
  padding: 30px;
  text-align: center;
}

h1 {
  color: #00f5c4;
  margin-bottom: 10px;
}

canvas {
  max-width: 800px;
  margin: 20px auto;
  display: block;
  background: #1a1a1a;
  border-radius: 10px;
  padding: 10px;
}

table {
  width: 100%;
  max-width: 800px;
  margin: 20px auto;
  border-collapse: collapse;
  background: #1a1a1a;
  border-radius: 10px;
  overflow: hidden;
  box-shadow: 0 0 10px #00f5c433;
}

th, td {
  padding: 12px;
  border-bottom: 1px solid #333;
}

th {
  background: #00f5c420;
  color: #00f5c4;
}

tr:hover {
  background: #222;
}

#status {
  color: #00f5c4;
  margin: 15px;
}
</style>
</head>
<body>

<h1>📊 لوحة أرباح الاشتراكات الأسبوعية</h1>
<p id="status">جارٍ حساب الأرباح...</p>

<canvas id="earningsChart" height="150"></canvas>

<table id="earningsTable">
  <thead>
    <tr>
      <th>🗓 الأسبوع</th>
      <th>👥 عدد المشتركين</th>
      <th>💰 الأرباح (جنيه)</th>
    </tr>
  </thead>
  <tbody id="tableBody"></tbody>
</table>

<script>
// إعداد Firebase
const firebaseConfig = {
  apiKey: "AIzaSyCdhj73cKJc2J2_tDHw2-89EemZx-EGMJQ",
  authDomain: "alamer-526ff.firebaseapp.com",
  databaseURL: "https://alamer-526ff-default-rtdb.firebaseio.com",
  projectId: "alamer-526ff",
  storageBucket: "alamer-526ff.appspot.com",
  messagingSenderId: "523879269039",
  appId: "1:523879269039:web:634861aa34641bfebf8a5a"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.database();

const statusEl = document.getElementById("status");
const tableBody = document.getElementById("tableBody");
const chartCanvas = document.getElementById("earningsChart");

const subscriptionPrice = 100; // سعر الاشتراك الشهري
const DAY = 24 * 60 * 60 * 1000;
const WEEK = 7 * DAY;
const MONTH = 30 * DAY;

// 🔹 تحديد أول الأسبوع بحيث ينتهي يوم الاثنين
function getWeekNumber(timestamp) {
  const mondayOffset = 1; // الاثنين
  const baseDate = new Date(2024, 0, 1);
  const diff = timestamp - baseDate.getTime();
  const adjusted = diff - ((baseDate.getDay() - mondayOffset + 7) % 7) * DAY;
  return Math.floor(adjusted / WEEK);
}

function calculateWeeklyEarnings() {
  db.ref("approvedStudents").once("value").then(snapshot => {
    if (!snapshot.exists()) {
      statusEl.textContent = "❌ لا يوجد طلاب.";
      return;
    }

    const now = Date.now();
    let weeklyData = {};

    snapshot.forEach(child => {
      const data = child.val();
      const approvedAt = data.approvedAt || 0;
      const expiry = data.expiry || 0;

      if (!approvedAt || !expiry) return;

      const duration = expiry - approvedAt;
      const isPaid = duration > 2 * DAY;
      if (!isPaid) return;

      // 🔁 احسب كل 30 يوم كاشتراك جديد
      const monthsCount = Math.ceil(duration / MONTH);
      for (let i = 0; i < monthsCount; i++) {
        const monthStart = approvedAt + i * MONTH;
        const weekNum = getWeekNumber(monthStart);
        if (!weeklyData[weekNum]) weeklyData[weekNum] = { count: 0, total: 0 };
        weeklyData[weekNum].count++;
        weeklyData[weekNum].total += subscriptionPrice;
      }
    });

    db.ref("weeklyEarnings").set(weeklyData);
    renderTable(weeklyData);
    renderChart(weeklyData);
    statusEl.textContent = "✅ تم حساب الأرباح الأسبوعية بنجاح.";
  });
}

// 🔹 عرض الجدول
function renderTable(weeklyData) {
  tableBody.innerHTML = "";
  const sortedWeeks = Object.keys(weeklyData).sort((a,b)=>b-a);
  const now = Date.now();
  const currentWeek = getWeekNumber(now);

  sortedWeeks.forEach(weekNum => {
    const w = weeklyData[weekNum];
    const label = (weekNum == currentWeek) ? "الأسبوع الحالي" : `الأسبوع ${weekNum}`;
    const tr = `
      <tr style="${weekNum == currentWeek ? 'background:#00f5c420;' : ''}">
        <td>${label}</td>
        <td>${w.count}</td>
        <td>${w.total}</td>
      </tr>`;
    tableBody.insertAdjacentHTML("beforeend", tr);
  });
}

// 🔹 رسم المخطط البياني
function renderChart(weeklyData) {
  const labels = Object.keys(weeklyData).sort((a,b)=>a-b);
  const earnings = labels.map(week => weeklyData[week].total);

  new Chart(chartCanvas, {
    type: "bar",
    data: {
      labels: labels.map(w => `أسبوع ${w}`),
      datasets: [{
        label: "الأرباح الأسبوعية (جنيه)",
        data: earnings,
        backgroundColor: "#00f5c4aa",
        borderColor: "#00f5c4",
        borderWidth: 2,
        borderRadius: 5
      }]
    },
    options: {
      scales: {
        x: { ticks: { color: "#fff" } },
        y: { ticks: { color: "#fff" }, beginAtZero: true }
      },
      plugins: {
        legend: { labels: { color: "#00f5c4" } }
      }
    }
  });
}

calculateWeeklyEarnings();
</script>
</body>
</html>

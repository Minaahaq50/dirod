<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>لوحة الإدارة - تصنيف الطلاب</title>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>

<style>
body { font-family:'Cairo', sans-serif; background:#111; color:white; padding:20px; }
h1 { text-align:center; color:#00f5c4; }
form { max-width:400px; margin:0 auto; text-align:center; }
input, select { width:100%; padding:10px; margin:8px 0; border-radius:6px; border:none; }
button { padding:10px 20px; margin:8px; cursor:pointer; border:none; border-radius:5px; background:#00f5c4; color:#111; font-weight:bold; }
.delete { background:#ff4f4f; color:white; }
#studentsTable { width:100%; border-collapse: collapse; margin-top:20px; background:#222; display:none; }
th, td { border:1px solid #444; padding:10px; text-align:center; font-size:14px; }
#status { text-align:center; color:#00f5c4; margin:10px; }
#error { text-align:center; color:#ff4f4f; margin:10px; }
#filters { display:none; text-align:center; margin-bottom:15px; }
#summary { text-align:center; margin:10px; color:#00f5c4; font-size:16px; }
</style>
</head>
<body>

<h1>لوحة الإدارة</h1>

<!-- فورم تسجيل الدخول -->
<div id="loginDiv">
  <form id="adminLogin">
    <input type="email" id="adminEmail" placeholder="البريد الإلكتروني" required>
    <input type="password" id="adminPassword" placeholder="كلمة المرور" required>
    <button type="submit">تسجيل الدخول</button>
  </form>
</div>

<p id="status"></p>
<p id="error"></p>

<div id="filters">
  <input type="text" id="searchInput" placeholder="🔍 بحث بالاسم أو رقم الهاتف">
  <select id="typeFilter">
    <option value="all">كل الأنواع</option>
    <option value="paid">المدفوعين</option>
    <option value="trial">التجربة</option>
  </select>

  <select id="weekFilter">
    <option value="all">كل الأسابيع</option>
    <option value="0">الأسبوع الحالي</option>
    <option value="1">الأسبوع الماضي</option>
    <option value="2">من أسبوعين</option>
  </select>

  <button onclick="applyFilters()">تصفية</button>
</div>

<p id="summary"></p>

<table id="studentsTable">
  <thead>
    <tr>
      <th>الاسم</th>
      <th>الهاتف</th>
      <th>الشعبة</th>
      <th>النوع</th>
      <th>تاريخ البداية</th>
      <th>تاريخ الانتهاء</th>
      <th>إجراء</th>
    </tr>
  </thead>
  <tbody id="studentsBody"></tbody>
</table>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyCdhj73cKJc2J2_tDHw2-89EemZx-EGMJQ",
  authDomain: "alamer-526ff.firebaseapp.com",
  databaseURL: "https://alamer-526ff-default-rtdb.firebaseio.com",
  projectId: "alamer-526ff",
  storageBucket: "alamer-526ff.appspot.com",
  messagingSenderId: "523879269039",
  appId: "1:523879269039:web:634861aa34641bfebf8a5a"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.database();
const auth = firebase.auth();

const adminUid = "CiYcWf7Xo5Yzex4fslyWO40FyQh2";
const studentsBody = document.getElementById("studentsBody");
const statusEl = document.getElementById("status");
const errorEl = document.getElementById("error");
const summary = document.getElementById("summary");

let studentsData = {};

document.getElementById("adminLogin").addEventListener("submit", e=>{
  e.preventDefault();
  errorEl.textContent="";
  statusEl.textContent="جارٍ تسجيل الدخول...";
  const email = document.getElementById("adminEmail").value.trim();
  const password = document.getElementById("adminPassword").value.trim();

  auth.signInWithEmailAndPassword(email,password)
  .then(res=>{
    if(res.user.uid !== adminUid){
      errorEl.textContent="❌ هذا الحساب ليس مسؤولاً.";
      auth.signOut();
      return;
    }
    statusEl.textContent="✅ تم تسجيل الدخول كمسؤول.";
    document.getElementById("loginDiv").style.display="none";
    document.getElementById("filters").style.display="block";
    document.getElementById("studentsTable").style.display="table";
    loadStudents();
  })
  .catch(err=>{
    errorEl.textContent="❌ فشل تسجيل الدخول.";
    console.error(err);
  });
});

function loadStudents(){
  studentsBody.innerHTML="";
  db.ref("approvedStudents").once("value")
  .then(snapshot=>{
    if(!snapshot.exists()){
      studentsBody.innerHTML="<tr><td colspan='7'>لا يوجد طلاب.</td></tr>";
      return;
    }
    studentsData = {};
    snapshot.forEach(child=>{
      const uid = child.key;
      const data = child.val();
      const approvedAt = data.approvedAt || 0;
      const expiry = data.expiry || 0;
      const duration = expiry - approvedAt;
      const twoDays = 2 * 24 * 60 * 60 * 1000;
      const type = duration > twoDays ? "paid" : "trial"; // تحديد النوع تلقائيًا

      studentsData[uid] = {
        name: data.name || "-",
        phone: data.phone || "-",
        class: data.class || "-",
        deviceId: uid,
        approvedAt,
        expiry,
        type
      };
    });
    renderStudents(studentsData);
  });
}

function renderStudents(data){
  studentsBody.innerHTML="";
  let count = 0;
  let total = 0;
  for(const uid in data){
    const s = data[uid];
    const startDate = new Date(s.approvedAt).toLocaleDateString("ar-EG");
    const expiryDate = new Date(s.expiry).toLocaleDateString("ar-EG");
    const typeText = s.type === "paid" ? "💰 اشتراك" : "🎁 تجربة";
    if(s.type === "paid") total += 100; // فرضًا الاشتراك الشهري 100 جنيه
    count++;

    const tr = document.createElement("tr");
    tr.innerHTML = `
      <td>${s.name}</td>
      <td>${s.phone}</td>
      <td>${s.class}</td>
      <td>${typeText}</td>
      <td>${startDate}</td>
      <td>${expiryDate}</td>
      <td><button class="delete" onclick="deleteStudent('${uid}','${s.name}')">🗑 حذف</button></td>
    `;
    studentsBody.appendChild(tr);
  }
  summary.textContent = `👥 عدد الطلاب: ${count} | 💵 إجمالي الاشتراكات: ${total} جنيه`;
}

function applyFilters(){
  const search = document.getElementById("searchInput").value.trim().toLowerCase();
  const type = document.getElementById("typeFilter").value;
  const week = document.getElementById("weekFilter").value;
  const now = Date.now();

  const filtered = {};
  for(const uid in studentsData){
    const s = studentsData[uid];

    if(type !== "all" && s.type !== type) continue;

    if(search){
      const nameMatch = s.name.toLowerCase().includes(search);
      const phoneMatch = s.phone.toLowerCase().includes(search);
      if(!nameMatch && !phoneMatch) continue;
    }

    if(week !== "all"){
      const diffWeeks = Math.floor((now - s.approvedAt) / (7*24*60*60*1000));
      if(diffWeeks != week) continue;
    }

    filtered[uid] = s;
  }

  renderStudents(filtered);
}

function deleteStudent(uid,name){
  if(confirm(`هل أنت متأكد من حذف ${name}؟`)){
    db.ref("approvedStudents/"+uid).remove().then(()=>{
      statusEl.textContent=`✅ تم حذف ${name}`;
      loadStudents();
    });
  }
}
</script>
</body>
</html>
